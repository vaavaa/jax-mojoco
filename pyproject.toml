[project]
name = "jax-MuJoCo"
version = "0.1.0"
description = "Ускоренные вычисления движения планет на JAX"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "jax[cpu]>=0.4.20",
    "wandb",
    "python-dotenv",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda13]>=0.4.20",
]
# MuJoCo под JAX (MJX): симуляция на GPU/TPU через JAX
mujoco = [
    "mujoco",
    "mujoco-mjx",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []   # заготовка без своего пакета — код в examples/ и tests/

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
